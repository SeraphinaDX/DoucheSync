[client]
device_id = "desktop"
listen = ":7444"
# Automatically select this client's LAN address. Can also be omitted.
advertise_url = "auto"
# Optional router TCP port mapping for peers outside your LAN.
nat_traversal = false
# advertise_interface = "enp3s0" # optional preferred LAN/VPN adapter
discovery_url = "https://sync.example.com"
discovery_token = "REPLACE_WITH_DISCOVERY_KEY_FROM_KEYGEN"
scan_interval = "10s"
transfer_timeout = "30m"
parallel_transfers = 4 # simultaneous downloads; 1..32
parallel_deletes = 4   # simultaneous recovery copies/hashes for deletes; 1..32
allow_http_discovery = false

[[folders]]
id = "documents"
path = "~/Documents/Shared"
# Same ID and secret on all clients sharing this folder. Paths may differ.
secret = "REPLACE_WITH_DOCUMENTS_KEY_FROM_KEYGEN"
sync_deletes = false
ignore = ["*.tmp", "*.swp", ".git", "node_modules"]
max_file_size = 10737418240 # 10 GiB

[[folders]]
id = "photos"
path = "~/Pictures/Shared"
secret = "REPLACE_WITH_PHOTOS_KEY_FROM_KEYGEN"
sync_deletes = false
ignore = ["*.tmp"]
max_file_size = 10737418240
