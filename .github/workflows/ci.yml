name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable
      - name: Tests
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -o DoucheSync${{ runner.os == 'Windows' && '.exe' || '' }} .
      - name: Race detector
        if: runner.os == 'Linux'
        run: go test -race ./...
      - name: Three-client process test
        if: runner.os == 'Linux'
        run: python3 scripts/smoke.py ./DoucheSync
